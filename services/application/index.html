<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shorts</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --text: #f0ece4;
      --text-muted: #8a8680;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --green-bg: rgba(52,211,153,0.12);
      --yellow-bg: rgba(251,191,36,0.12);
      --red-bg: rgba(248,113,113,0.12);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- App Shell ---------- */
    #app {
      display: none;
      height: 100%;
      width: 100%;
    }

    .feed {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar { display: none; }

    /* ---------- Video Card ---------- */
    .video-card {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      overflow: hidden;
    }

    .video-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Gradient overlays */
    .video-card::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    .video-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 20%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* No video placeholder */
    .no-video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      z-index: 0;
    }

    .no-video-placeholder svg {
      opacity: 0.3;
    }

    /* ---------- Info Overlay ---------- */
    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px 24px;
      padding-bottom: max(28px, env(safe-area-inset-bottom, 28px));
      z-index: 2;
    }

    .flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .flag-badge.green  { background: var(--green-bg);  color: var(--green);  }
    .flag-badge.yellow { background: var(--yellow-bg); color: var(--yellow); }
    .flag-badge.red    { background: var(--red-bg);    color: var(--red);    }

    .flag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .flag-badge.green  .flag-dot { background: var(--green);  }
    .flag-badge.yellow .flag-dot { background: var(--yellow); }
    .flag-badge.red    .flag-dot { background: var(--red);    }

    .video-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      line-height: 1.25;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .video-channel {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .video-summary {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(240,236,228,0.75);
      max-width: 420px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    /* ---------- Top Bar ---------- */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 18px 24px;
      padding-top: max(18px, env(safe-area-inset-top, 18px));
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-bar span {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .counter {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 100px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* ---------- Processing State ---------- */
    .processing-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.08);
      color: var(--text-muted);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .processing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .processing-text {
      font-style: italic;
      opacity: 0.6;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ---------- Scroll Hint ---------- */
    .scroll-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      animation: bounce 2s infinite;
      opacity: 0.4;
    }

    /* ---------- Loading ---------- */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 8px;
      font-size: 15px;
    }

    /* ---------- Tap to play/pause ---------- */
    .play-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 5;
      background: rgba(0,0,0,0.45);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0;
    }

    .play-indicator.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* ---------- Animations ---------- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-6px); }
    }

    /* ---------- Filter Bar ---------- */
    .filter-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top, 14px));
      background: rgba(10,10,11,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }

    .filter-bar.open { transform: translateY(0); }

    .filter-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .filter-chip input[type="checkbox"] {
      display: none;
    }

    .chip-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      border: 1.5px solid transparent;
      transition: all 0.2s ease;
      opacity: 0.4;
    }

    .filter-chip input:checked + .chip-label {
      opacity: 1;
    }

    .chip-label.safe {
      background: var(--green-bg);
      color: var(--green);
      border-color: rgba(52,211,153,0.25);
    }

    .chip-label.vulnerable {
      background: var(--yellow-bg);
      color: var(--yellow);
      border-color: rgba(251,191,36,0.25);
    }

    .chip-label.risky {
      background: var(--red-bg);
      color: var(--red);
      border-color: rgba(248,113,113,0.25);
    }

    .filter-chip input:not(:checked) + .chip-label {
      border-color: transparent;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .safe .chip-dot { background: var(--green); }
    .vulnerable .chip-dot { background: var(--yellow); }
    .risky .chip-dot { background: var(--red); }

    .filter-toggle {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .filter-toggle.active { color: var(--text); }

    /* ---------- Responsive ---------- */
    @media (min-width: 600px) {
      .feed {
        max-width: 420px;
        margin: 0 auto;
        border-left: 1px solid rgba(255,255,255,0.04);
        border-right: 1px solid rgba(255,255,255,0.04);
      }

      .top-bar {
        max-width: 420px;
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>

  <!-- App -->
  <div id="app" style="display:block">
    <!-- Filter Bar -->
    <div class="filter-bar" id="filterBar">
      <label class="filter-chip">
        <input type="checkbox" value="safe" checked onchange="applyFilters()">
        <span class="chip-label safe"><span class="chip-dot"></span>Safe (0–3)</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" value="vulnerable" checked onchange="applyFilters()">
        <span class="chip-label vulnerable"><span class="chip-dot"></span>Vulnerable (4–7)</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" value="risky" checked onchange="applyFilters()">
        <span class="chip-label risky"><span class="chip-dot"></span>Risky (8–10)</span>
      </label>
    </div>

    <div class="top-bar">
      <span>Shorts</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="filter-toggle" id="filterToggle" onclick="toggleFilter()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4h18M6 8h12M9 12h6M11 16h2"/></svg>
          Filter
        </button>
        <div class="counter" id="counter"></div>
      </div>
    </div>
    <div class="feed" id="feed">
      <div class="loading-screen"><div class="spinner"></div><span style="color:var(--text-muted);font-size:13px">Loading videos...</span></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let videos = [];
    let filteredVideos = [];

    function toggleFilter() {
      const bar = document.getElementById('filterBar');
      const btn = document.getElementById('filterToggle');
      bar.classList.toggle('open');
      btn.classList.toggle('active');
    }

    function getActiveCategories() {
      const checks = document.querySelectorAll('#filterBar input[type="checkbox"]');
      const active = [];
      checks.forEach(cb => { if (cb.checked) active.push(cb.value); });
      return active;
    }

    function videoMatchesFilter(v, categories) {
      const isProcessing = v.summary === null || v.summary === '' || v.level === null;
      if (isProcessing) return true; // always show processing videos
      if (v.level <= 3 && categories.includes('safe')) return true;
      if (v.level >= 4 && v.level <= 7 && categories.includes('vulnerable')) return true;
      if (v.level >= 8 && categories.includes('risky')) return true;
      return false;
    }

    function applyFilters() {
      const categories = getActiveCategories();
      filteredVideos = videos.filter(v => videoMatchesFilter(v, categories));
      renderFeed();
    }

    async function loadVideos() {
      const url = SUPABASE_URL.replace(/\/+$/, '');
      const key = SUPABASE_KEY;

      try {
        const res = await fetch(`${url}/rest/v1/videos?select=*&order=created_at.asc`, {
          headers: {
            'apikey': key,
            'Authorization': `Bearer ${key}`,
            'Content-Type': 'application/json'
          }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

        const data = await res.json();

        if (!data || data.length === 0) {
          document.getElementById('feed').innerHTML = '<div class="empty-state"><span>No videos found</span></div>';
          return;
        }

        videos = data;
        filteredVideos = videos;
        renderFeed();
      } catch (err) {
        document.getElementById('feed').innerHTML = `<div class="empty-state"><span>Failed to load: ${err.message}</span></div>`;
      }
    }

    loadVideos();

    function getFlagInfo(level) {
      if (level <= 3) return { cls: 'green',  label: 'Safe' };
      if (level <= 7) return { cls: 'yellow', label: 'Caution' };
      return                  { cls: 'red',    label: 'Warning' };
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      const counter = document.getElementById('counter');

      if (filteredVideos.length === 0) {
        feed.innerHTML = '<div class="empty-state"><span>No videos match the selected filters</span></div>';
        counter.textContent = '0 / 0';
        return;
      }

      feed.innerHTML = filteredVideos.map((v, i) => {
        const hasVideo = !!v.video_url;
        const isProcessing = v.summary === null || v.summary === '' || v.level === null;
        const flag = isProcessing ? null : getFlagInfo(v.level);

        return `
          <div class="video-card" data-index="${i}">
            ${hasVideo
              ? `<video src="${v.video_url}" loop playsinline preload="metadata" muted></video>`
              : `<div class="no-video-placeholder">
                   <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                     <path d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9A2.25 2.25 0 0 0 13.5 5.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z"/>
                   </svg>
                   <span>No video uploaded</span>
                 </div>`
            }
            <div class="play-indicator" id="play-ind-${i}">
              <svg width="28" height="28" fill="white" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
            <div class="video-info">
              ${isProcessing
                ? `<div class="processing-badge">
                     <span class="processing-dot"></span>
                     Generating with pipeline…
                   </div>`
                : `<div class="flag-badge ${flag.cls}">
                     <span class="flag-dot"></span>
                     ${flag.label} · ${v.level}
                   </div>`
              }
              <div class="video-title">${escapeHtml(v.title)}</div>
              <div class="video-channel">@${escapeHtml(v.channel_name)}</div>
              ${isProcessing
                ? `<div class="video-summary processing-text">Summary is being generated with the pipeline…</div>`
                : `<div class="video-summary">${escapeHtml(v.summary)}</div>`
              }
            </div>
            ${i === 0 && filteredVideos.length > 1 ? `
              <div class="scroll-hint">
                <svg width="24" height="24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M12 5v14M19 12l-7 7-7-7"/>
                </svg>
              </div>` : ''}
          </div>
        `;
      }).join('');

      counter.textContent = `1 / ${filteredVideos.length}`;

      // Intersection Observer for autoplay and counter
      const cards = feed.querySelectorAll('.video-card');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const card = entry.target;
          const video = card.querySelector('video');
          const idx = parseInt(card.dataset.index);

          if (entry.isIntersecting) {
            counter.textContent = `${idx + 1} / ${filteredVideos.length}`;
            if (video) {
              video.currentTime = 0;
              video.play().catch(() => {});
            }
          } else {
            if (video) {
              video.pause();
            }
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));

      // Tap to play/pause
      cards.forEach(card => {
        const video = card.querySelector('video');
        if (!video) return;

        card.addEventListener('click', () => {
          const indicator = card.querySelector('.play-indicator');
          if (video.paused) {
            video.play().catch(() => {});
            indicator.innerHTML = `<svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
          } else {
            video.pause();
            indicator.innerHTML = `<svg width="28" height="28" fill="white" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
          }
          indicator.classList.add('show');
          setTimeout(() => indicator.classList.remove('show'), 600);
        });

        // Unmute on first interaction
        video.addEventListener('click', () => { video.muted = false; }, { once: true });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

  </script>
</body>
</html>
